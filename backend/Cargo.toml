[workspace]
members = ["crates/engine", "crates/backend"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde_json = "1"
# The official SDK source snapshot and its verified provenance are vendored.
lithe-plugin-sdk = { path = "../vendor/lithe-plugin-sdk" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
