[workspace]
members = ["crates/engine", "crates/backend"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde_json = "1"
# The official SDK, pinned to a commit; Cargo.lock records it and
# `cargo build --locked` refuses anything else.
lithe-plugin-sdk = { git = "https://github.com/Lithe-IDEA/lithe-plugin-docs", rev = "5da0524f4751425c216bf5162c9fc1eb1dddd22f" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
