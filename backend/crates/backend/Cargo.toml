[package]
name = "lithe-database-backend"
description = "The plugin backend of the Lithe database plugin."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lithe-database-backend"
path = "src/main.rs"

[dependencies]
lithe-database-engine = { path = "../engine" }
lithe-plugin-sdk.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# DBX connection exports: PBKDF2-SHA256 keys and AES-256-GCM, pure Rust.
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
hmac = "=0.12.1"
pbkdf2 = { version = "=0.11.0", default-features = false }
sha2 = "=0.10.9"
