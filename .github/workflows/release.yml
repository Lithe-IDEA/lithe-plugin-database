# Publishes a release for each `v<version>` tag whose version matches
# plugin.json. Only maintainers may create `v*` tags. The package is a
# community package without a Lithe signature: Lithe Store lists the
# release's archive by its SHA-256, and its release tracker picks up later
# versions on its own.
# Tags listed in PRERELEASE_TAGS are published as pre-releases, which the
# tracker skips. docs/releases/<tag>.md, when present, is the release notes.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # v0.1.2 needs a host offering litheLogging 1, which stable Lithe 0.6.7
  # lacks. Space-separated tags.
  PRERELEASE_TAGS: v0.1.2
  # Exact preview commit containing the litheLogging 1 host API (1lck/Lithe-IDEA#1699).
  CORE_REF: 4dd3165912a7ef4ccfd7240890a33b63751c9b3e

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Require the tag to match plugin.json
        run: test "v$(node -p "require('./plugin.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Test
        run: |
          npm ci --prefix ui
          npm --prefix ui run check
          npm --prefix ui test
          cargo test --locked --manifest-path backend/Cargo.toml
      - name: Build the package
        run: node scripts/package.mjs
      - name: Run the backend through Rust Core
        run: node scripts/e2e.mjs --source https://github.com/1lck/Lithe-IDEA.git --ref "$CORE_REF"
      - name: Verify the archive users download
        run: |
          id=$(node -p "require('./plugin.json').id")
          mkdir -p dist/verify
          ditto -x -k dist/*-darwin.zip dist/verify
          # Lithe Store accepts exactly one plugin.json, under the package folder.
          test "$(find dist/verify -name plugin.json | wc -l | tr -d ' ')" = 1
          diff -r "dist/$id" "dist/verify/$id"
          test "$(lipo -archs "dist/verify/$id/bin/lithe-database-backend")" = "x86_64 arm64"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=$(ls dist/*-darwin.zip)
          notes="$RUNNER_TEMP/notes.md"
          if [[ -s "docs/releases/$GITHUB_REF_NAME.md" ]]; then
            cp "docs/releases/$GITHUB_REF_NAME.md" "$notes"
          else
            echo "Lithe database plugin $GITHUB_REF_NAME for macOS (Apple silicon and Intel)." > "$notes"
          fi
          printf '\nSHA-256: %s\n' "$(cat "$archive.sha256")" >> "$notes"
          release_flags=()
          for tag in $PRERELEASE_TAGS; do
            if [[ "$tag" == "$GITHUB_REF_NAME" ]]; then release_flags+=(--prerelease); fi
          done
          # Published assets are never replaced: Lithe Store pins their SHA-256.
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            --verify-tag \
            --title "Database $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            "${release_flags[@]}"
